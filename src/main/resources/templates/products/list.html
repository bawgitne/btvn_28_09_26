<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý Sản phẩm</title>
</head>
<body>
<main class="container" layout:fragment="content">
    <div style="margin-bottom: 20px;">
        <h1 style="font-size: 1.8rem; font-weight: 800; color: #1e293b;">Quản Lý Sản Phẩm (Products)</h1>
        <p style="color: #64748b;">Danh sách sản phẩm trong hệ thống (Hỗ trợ upload ảnh Cloudinary)</p>
    </div>

    <!-- Thông báo -->
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <!-- Thanh công cụ tìm kiếm và Thêm mới -->
    <div class="toolbar">
        <form th:action="@{/products}" method="get">
            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Tìm theo tên sản phẩm, mô tả...">
            <input type="hidden" name="size" th:value="${size}">
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <a class="button" th:href="@{/products/create}">+ Thêm Sản Phẩm</a>
    </div>

    <!-- Bảng danh sách sản phẩm -->
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Hình ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Giá (VNĐ)</th>
                <th>Người tạo</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products.content}">
                <td th:text="${p.id}"></td>
                <td>
                    <img th:if="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
                         th:src="${#strings.contains(p.imageUrl, '|') ? #strings.substringBefore(p.imageUrl, '|') : p.imageUrl}"
                         alt="Product"
                         class="thumb">
                    <span th:unless="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
                          style="font-size: 0.8rem; color: #94a3b8; font-style: italic;">Chưa có ảnh</span>
                </td>
                <td>
                    <strong th:text="${p.name}">Tên SP</strong>
                    <p style="font-size: 0.8rem; color: #64748b; max-width: 350px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                       th:text="${p.description}">Mô tả</p>
                </td>
                <td style="font-weight: 700; color: #0f766e;"
                    th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'POINT')} + ' đ'">0 đ</td>
                <td>
                    <span style="font-size: 0.85rem; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-weight: 600;"
                          th:text="${p.username != null ? p.username : 'N/A'}">User</span>
                </td>
                <td class="actions">
                    <a class="button small secondary" th:href="@{/products/edit/{id}(id=${p.id})}">Sửa</a>
                    <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post"
                          onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="danger-link" type="submit">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${products.empty}">
                <td colspan="6" style="text-align: center; padding: 25px; color: #94a3b8;">
                    Chưa có sản phẩm nào trong hệ thống.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Phân trang -->
    <div class="pagination" th:if="${products.totalPages > 1}">
        <a th:if="${products.hasPrevious()}"
           th:href="@{/products(page=${products.number - 1}, size=${size}, keyword=${keyword})}">«</a>

        <span th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}">
            <a th:classappend="${i == products.number ? 'active' : ''}"
               th:href="@{/products(page=${i}, size=${size}, keyword=${keyword})}"
               th:text="${i + 1}">1</a>
        </span>

        <a th:if="${products.hasNext()}"
           th:href="@{/products(page=${products.number + 1}, size=${size}, keyword=${keyword})}">»</a>
    </div>
</main>
</body>
</html>
