<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${mode == 'create' ? 'Thêm Sản Phẩm' : 'Chỉnh Sửa Sản Phẩm'}">Sản Phẩm</title>
</head>
<body>
<main class="container narrow" layout:fragment="content">
    <div class="form-card">
        <h1 style="font-size: 1.6rem; font-weight: 800; color: #1e293b; margin-bottom: 20px;"
            th:text="${mode == 'create' ? 'Thêm Sản Phẩm Mới' : 'Cập Nhật Sản Phẩm'}">Sản Phẩm</h1>

        <form th:object="${productDTO}" method="post" enctype="multipart/form-data" accept-charset="UTF-8"
              th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{id}">

            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <label for="name">Tên sản phẩm</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Nhập tên sản phẩm" required>
            <small class="error-text" th:errors="*{name}"></small>

            <label for="description">Mô tả sản phẩm</label>
            <textarea id="description" th:field="*{description}" rows="4" placeholder="Nhập mô tả chi tiết sản phẩm..."></textarea>
            <small class="error-text" th:errors="*{description}"></small>

            <label for="price">Giá bán (VNĐ)</label>
            <input type="number" id="price" th:field="*{price}" step="1000" min="0" placeholder="VD: 500000" required>
            <small class="error-text" th:errors="*{price}"></small>

            <label for="image">Hình ảnh sản phẩm (Tải lên Cloudinary / Local)</label>
            <input type="file" id="image" name="image" accept="image/*">

            <!-- Xem trước hình ảnh nếu đã có -->
            <div th:if="${productDTO.imageUrl != null and !#strings.isEmpty(productDTO.imageUrl)}" style="margin-top: 15px;">
                <p style="font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 6px;">Ảnh hiện tại:</p>
                <img th:src="${#strings.contains(productDTO.imageUrl, '|') ? #strings.substringBefore(productDTO.imageUrl, '|') : productDTO.imageUrl}"
                     alt="Preview"
                     class="preview">
            </div>

            <div style="margin-top: 25px; display: flex; gap: 12px;">
                <button class="button" type="submit">Lưu sản phẩm</button>
                <a class="button secondary" th:href="@{/products}">Hủy</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
