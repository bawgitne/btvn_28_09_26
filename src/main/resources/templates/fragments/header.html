<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="header">
    <a th:href="@{/}" class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        IOTSTAR SHOP
    </a>

    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/products}">Products</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}">Users</a>
    </nav>

    <!-- Khi đã đăng nhập -->
    <div class="account" sec:authorize="isAuthenticated()">
        <!-- Avatar người dùng (Ví dụ 2) -->
        <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
             alt="Avatar"
             class="avatar">

        <div class="user-info">
            <span class="user-name" th:text="${#authentication.principal.fullName}">Họ và Tên</span>
            <span style="font-size: 0.75rem; color: #94a3b8;" th:text="'(' + ${#authentication.principal.username} + ')'">(username)</span>
            <span class="user-role-badge"
                  th:classappend="${#authentication.principal.role == 'ROLE_ADMIN' ? 'role-admin' : ''}"
                  th:text="${#authentication.principal.role}">ROLE_USER</span>
        </div>

        <!-- Nút Đăng xuất -->
        <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 8px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>

    <!-- Khi chưa đăng nhập -->
    <div class="account" sec:authorize="!isAuthenticated()">
        <a class="button small secondary" th:href="@{/register}">Đăng ký</a>
        <a class="button small" th:href="@{/login}">Đăng nhập</a>
    </div>
</header>
</body>
</html>
