<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Đăng Ký Tài Khoản</h2>

    <form th:action="@{/register}" th:object="${registerDTO}" method="post">
        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- Lỗi chung -->
        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <label for="username">Tên đăng nhập (Username)</label>
        <input type="text" id="username" th:field="*{username}" placeholder="VD: nguyenvana">
        <small class="error-text" th:errors="*{username}"></small>

        <label for="email">Địa chỉ Email</label>
        <input type="email" id="email" th:field="*{email}" placeholder="VD: vana@gmail.com">
        <small class="error-text" th:errors="*{email}"></small>

        <label for="fullName">Họ và tên</label>
        <input type="text" id="fullName" th:field="*{fullName}" placeholder="VD: Nguyễn Văn A">
        <small class="error-text" th:errors="*{fullName}"></small>

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự">
        <small class="error-text" th:errors="*{password}"></small>

        <label for="confirmPassword">Xác nhận mật khẩu</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu">
        <small class="error-text" th:errors="*{confirmPassword}"></small>

        <div style="margin-top: 22px;">
            <button class="button full" type="submit">Đăng ký &amp; Nhận mã OTP</button>
        </div>
    </form>

    <div class="auth-footer">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
    </div>
</div>
</body>
</html>
