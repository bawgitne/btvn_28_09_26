<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác nhận mã OTP - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>Xác Nhận OTP</h1>
    <h2>Kích Hoạt Tài Khoản</h2>

    <!-- Thông báo từ redirect attributes -->
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <label for="email">Email đăng ký</label>
        <input type="email" id="email" th:field="*{email}" required readonly style="background-color: #f8fafc;">
        <small class="error-text" th:errors="*{email}"></small>

        <label for="otp">Mã OTP (6 chữ số)</label>
        <input type="text"
               id="otp"
               th:field="*{otp}"
               maxlength="6"
               inputmode="numeric"
               placeholder="123456"
               style="letter-spacing: 4px; font-size: 1.2rem; text-align: center; font-weight: bold;"
               required
               autofocus>
        <small class="error-text" th:errors="*{otp}"></small>

        <div style="margin-top: 20px;">
            <button class="button full" type="submit">Xác nhận kích hoạt</button>
        </div>
    </form>

    <!-- Form gửi lại OTP -->
    <form th:action="@{/resend-register-otp}" method="post" style="margin-top: 15px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
        <button class="button secondary full" type="submit">Gửi lại mã OTP</button>
    </form>

    <div class="auth-footer">
        <a th:href="@{/login}">Quay lại trang Đăng nhập</a>
    </div>
</div>
</body>
</html>
