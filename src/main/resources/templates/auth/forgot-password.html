<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>Quên Mật Khẩu</h1>
    <h2>Khôi Phục Mật Khẩu Qua Email</h2>

    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <label for="email">Nhập Email đã đăng ký</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               placeholder="email@example.com"
               required
               autofocus>
        <small class="error-text" th:errors="*{email}"></small>

        <div style="margin-top: 22px;">
            <button class="button full" type="submit">Gửi mã OTP đặt lại mật khẩu</button>
        </div>
    </form>

    <div class="auth-footer">
        <a th:href="@{/login}">Quay lại trang Đăng nhập</a>
    </div>
</div>
</body>
</html>
