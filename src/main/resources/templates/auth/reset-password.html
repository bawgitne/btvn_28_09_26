<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>Đặt Lại Mật Khẩu</h1>
    <h2>Nhập OTP &amp; Mật Khẩu Mới</h2>

    <!-- Thông báo -->
    <div class="alert success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required placeholder="email@example.com">
        <small class="error-text" th:errors="*{email}"></small>

        <label for="otp">Mã OTP (6 số)</label>
        <input type="text"
               id="otp"
               name="otp"
               maxlength="6"
               inputmode="numeric"
               placeholder="123456"
               style="letter-spacing: 3px; font-weight: bold;"
               required>

        <label for="password">Mật khẩu mới</label>
        <input type="password" id="password" th:field="*{password}" required placeholder="Tối thiểu 6 ký tự">
        <small class="error-text" th:errors="*{password}"></small>

        <label for="confirmPassword">Xác nhận mật khẩu mới</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required placeholder="Nhập lại mật khẩu mới">
        <small class="error-text" th:errors="*{confirmPassword}"></small>

        <div style="margin-top: 22px;">
            <button class="button full" type="submit">Đổi mật khẩu</button>
        </div>
    </form>

    <div class="auth-footer">
        <a th:href="@{/login}">Quay lại trang Đăng nhập</a>
    </div>
</div>
</body>
</html>
