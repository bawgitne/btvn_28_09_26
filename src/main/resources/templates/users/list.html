<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý Users</title>
</head>
<body>
<main class="container" layout:fragment="content">
    <div style="margin-bottom: 20px;">
        <h1 style="font-size: 1.8rem; font-weight: 800; color: #1e293b;">Quản Lý Người Dùng (Users)</h1>
        <p style="color: #64748b;">Danh sách tài khoản hệ thống (Dành cho Administrator)</p>
    </div>

    <!-- Thông báo -->
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <!-- Thanh công cụ tìm kiếm và Thêm mới -->
    <div class="toolbar">
        <form th:action="@{/users}" method="get">
            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Tìm theo username, email, họ tên...">
            <input type="hidden" name="size" th:value="${size}">
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <a class="button" th:href="@{/users/create}">+ Thêm User Mới</a>
    </div>

    <!-- Bảng người dùng -->
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Họ tên</th>
                <th>Vai trò</th>
                <th>Trạng thái</th>
                <th>Số SP</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users.content}">
                <td th:text="${u.id}"></td>
                <td>
                    <strong th:text="${u.username}"></strong>
                </td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.fullName}"></td>
                <td>
                    <span class="user-role-badge"
                          th:classappend="${u.roleName == 'ROLE_ADMIN' ? 'role-admin' : ''}"
                          th:text="${u.roleName}">ROLE_USER</span>
                </td>
                <td>
                    <span th:if="${u.enabled}" style="color: var(--success); font-weight: 600;">ACTIVE</span>
                    <span th:unless="${u.enabled}" style="color: var(--danger); font-weight: 600;">INACTIVE</span>
                </td>
                <td style="text-align: center; font-weight: bold;" th:text="${u.productCount}">0</td>
                <td class="actions">
                    <a class="button small secondary" th:href="@{/users/edit/{id}(id=${u.id})}">Sửa</a>
                    <form th:action="@{/users/delete/{id}(id=${u.id})}" method="post"
                          onsubmit="return confirm('Bạn có chắc chắn muốn xóa user này?');" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="danger-link" type="submit">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.empty}">
                <td colspan="8" style="text-align: center; padding: 25px; color: #94a3b8;">
                    Không tìm thấy người dùng nào.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Phân trang -->
    <div class="pagination" th:if="${users.totalPages > 1}">
        <a th:if="${users.hasPrevious()}"
           th:href="@{/users(page=${users.number - 1}, size=${size}, keyword=${keyword})}">«</a>

        <span th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
            <a th:classappend="${i == users.number ? 'active' : ''}"
               th:href="@{/users(page=${i}, size=${size}, keyword=${keyword})}"
               th:text="${i + 1}">1</a>
        </span>

        <a th:if="${users.hasNext()}"
           th:href="@{/users(page=${users.number + 1}, size=${size}, keyword=${keyword})}">»</a>
    </div>
</main>
</body>
</html>
