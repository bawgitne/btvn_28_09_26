<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${mode == 'create' ? 'Thêm Người Dùng' : 'Chỉnh Sửa Người Dùng'}">Người Dùng</title>
</head>
<body>
<main class="container narrow" layout:fragment="content">
    <div class="form-card">
        <h1 style="font-size: 1.6rem; font-weight: 800; color: #1e293b; margin-bottom: 20px;"
            th:text="${mode == 'create' ? 'Thêm Người Dùng Mới' : 'Cập Nhật Người Dùng'}">Người Dùng</h1>

        <form th:object="${userDTO}" method="post"
              th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <label for="username">Tên đăng nhập (Username)</label>
            <input type="text" id="username" th:field="*{username}" placeholder="Nhập username">
            <small class="error-text" th:errors="*{username}"></small>

            <label for="email">Địa chỉ Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Nhập email">
            <small class="error-text" th:errors="*{email}"></small>

            <label for="fullName">Họ và tên</label>
            <input type="text" id="fullName" th:field="*{fullName}" placeholder="Nhập họ tên đầy đủ">
            <small class="error-text" th:errors="*{fullName}"></small>

            <label for="roleName">Vai trò (Role)</label>
            <select id="roleName" th:field="*{roleName}">
                <option value="ROLE_USER">ROLE_USER (Người dùng thông thường)</option>
                <option value="ROLE_ADMIN">ROLE_ADMIN (Quản trị viên)</option>
            </select>
            <small class="error-text" th:errors="*{roleName}"></small>

            <div style="margin-top: 15px; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="enabled" th:field="*{enabled}" style="width: auto; margin: 0;">
                <label for="enabled" style="margin: 0; cursor: pointer;">Kích hoạt tài khoản (Enabled)</label>
            </div>

            <div th:if="${mode == 'create'}" class="note" style="margin-top: 18px; padding: 12px; background: #fef3c7; border-radius: 6px; font-size: 0.85rem; color: #92400e;">
                ℹ️ <strong>Lưu ý:</strong> Mật khẩu mặc định của người dùng mới được khởi tạo là: <code>123456</code>.
            </div>

            <div style="margin-top: 25px; display: flex; gap: 12px;">
                <button class="button" type="submit">Lưu thông tin</button>
                <a class="button secondary" th:href="@{/users}">Hủy</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
